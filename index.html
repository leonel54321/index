<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Redes Sociales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image:=<"https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Social_media_collection_2020s.png/410px-Social_media_collection_2020s.png;">
        }
        .redes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .redes a {
            text-decoration: none;
            font-size: 24px;

            padding: 10px 20px;
            border-radius: 5px;
        }
        .facebook { background-color: #1877F2; }
        .twitter { background-color: #1DA1F2; }
        .instagram { background-color: #E4405F; }
        .whatsapp { background-color: #3e7158; }
        .tiktok { background-color: #481c58; }
    </style><body style="background-color: coral;"></body>
</head>
<body>
    <h1>Mis Redes Sociales</h1>
    <p>Sígueme en mis redes sociales:</p>
    <div class="redes">
        <a href="https://www.facebook.com/" target="_blank" class="facebook">Facebook</a>
        <a href="https://www.twitter.com/" target="_blank" class="twitter">Twitter</a>
        <a href="https://www.instagram.com/" target="_blank" class="instagram">Instagram</a>
        <a href="https://web.whatsapp.com/" target="_blank" class="whatsapp">whatsapp</a>
        <a href="https://www.tiktok.com/es/"  target="_blank" class="tiktok">tiktok</a>
    </div>

</body>
</html>
